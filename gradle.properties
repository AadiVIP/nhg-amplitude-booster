org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# AGP's resource optimizer (aapt2 optimize) reports success but emits no
# resources package when driven by the ARM aapt2 build used for release builds
# here, which silently produced an APK with no AndroidManifest.xml and no
# resources.arsc. This app does not shrink resources, so the step is disabled
# outright rather than risk a manifest-less "successful" build.
android.enableResourceOptimizations=false

